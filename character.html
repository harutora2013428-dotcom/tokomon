<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャラクター一覧</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
キャラクター一覧
</header>

<nav>
<a href="index.html">🏠 ホーム</a>
<a href="character.html">👤 キャラクター一覧</a>
<a href="moves.html">⚔️ 技一覧</a>
<a href="abilities.html">✨ 特性一覧</a>
<a href="items.html">🎒 持ち物一覧</a>
</nav>

<div class="container">

<input
type="text"
id="search"
placeholder="キャラクター名を検索">

<div class="filter-box">

<select id="typeFilter">
<option value="">すべての属性</option>
<option value="おとこ">おとこ</option>
<option value="炎">炎</option>
<option value="雷">雷</option>
<option value="水">水</option>
<option value="風">風</option>
<option value="ブラッド">ブラッド</option>
<option value="月">月</option>
<option value="氷">氷</option>
<option value="ゴースト">ゴースト</option>
<option value="聖">聖</option>
<option value="闇">闇</option>
<option value="鋼">鋼</option>
<option value="毒">毒</option>
<option value="大地">大地</option>
<option value="虹">虹</option>
</select>

<select id="sort">
    <option value="id">No順</option>
    <option value="name">名前順</option>
    <option value="hp">HP順</option>
    <option value="attack">攻撃順</option>
    <option value="defense">防御順</option>
    <option value="spAttack">特攻順</option>
    <option value="spDefense">特防順</option>
    <option value="speed">速度順</option>
</select>

</div>

<div id="character-list"></div>

</div>

<script src="characters.js"></script>
<script src="typeChart.js"></script>
<script src="script.js"></script>

</body>
</html>
