<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技一覧</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
技一覧
</header>

<nav>
<a href="index.html">🏠 ホーム</a>
<a href="character.html">👤 キャラクター一覧</a>
<a href="moves.html">⚔️ 技一覧</a>
<a href="abilities.html">✨ 特性一覧</a>
<a href="items.html">🎒 持ち物一覧</a>
</nav>

<div class="container">

<input
type="text"
id="moveSearch"
placeholder="検索">

<div class="filter-box">

<select id="typeFilter">
<option value="">全ての属性</option>
<option value="おとこ">おとこ</option>
<option value="無">無</option>
<option value="炎">炎</option>
<option value="水">水</option>
<option value="雷">雷</option>
<option value="風">風</option>
<option value="大地">大地</option>
<option value="聖">聖</option>
<option value="闇">闇</option>
<option value="氷">氷</option>
<option value="毒">毒</option>
<option value="鋼">鋼</option>
<option value="ブラッド">ブラッド</option>
<option value="月">月</option>
<option value="ゴースト">ゴースト</option>
<option value="虹">虹</option>
</select>

<select id="categoryFilter">
<option value="">全ての分類</option>
<option value="物理">物理</option>
<option value="特殊">特殊</option>
<option value="変化">変化</option>
</select>

<select id="kindFilter">
<option value="">全ての種類</option>
<option value="通常">通常</option>
<option value="奥義">奥義</option>
<option value="Z技">Z技</option>
</select>

<select id="sort">
<option value="id">No順</option>
<option value="name">名前順</option>
<option value="power">威力順</option>
<option value="accuracy">命中順</option>
<option value="pp">PP順</option>
</select>

</div>

<div id="move-list"></div>

</div>

<script src="moves.js"></script>
<script src="script.js"></script>

</body>
</html>
